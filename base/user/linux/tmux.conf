set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'

set -g @dracula-plugins "cpu-usage network-ping weather battery time"
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session

run ~/.tmux/plugins/tpm/tpm
run ~/.tmux/plugins/tpm/bin/install_plugins

set -g default-terminal "xterm-256color"
set -g terminal-features ',xterm-256color:RGB'
set -ga terminal-overrides ',xterm-256color:Tc'
set -as terminal-features ',xterm-256color:RGB'
set -g escape-time 50
set -g history-limit 30000
set -g focus-events on

set -g renumber-windows on

set -s set-clipboard on


#set -g status-bg '#272732'
#set -g status-right "#{pane_title} #(tmux-mem-cpu-load) %H:%M %d-%b-%y"
#set -g status-style fg='#DDD8BB'
#set -g window-status-style fg='#DDD8BB'
#set -g message-style fg='#DDD8BB'
#set -g pane-border-style fg=black
#set -g pane-active-border-style fg='#DDD8BB'
#set -g pane-border-style fg='#DDD8BB'

unbind '"'
unbind %

bind v split-window -h -c "#{pane_current_path}"
bind x split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf

set -g mouse on
bind q detach

