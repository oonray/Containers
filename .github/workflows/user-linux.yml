name: Docker image user linux

on:
  push:
    paths:
      - 'base/user/linux/*'
      - 'base/user/linux/**'

jobs:
  build-user-debian:
    uses: oonray/Containers/.github/workflows/container.yml@main
    with:
      image: linux
      tag: v1.0.1
      base: debian:latest
      context: base/user/linux
    secrets:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}
